name: restore-gh-pages-v095
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
      - name: Download v0.9.5 web artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download restore-v0.9.5-artifact -R "$GITHUB_REPOSITORY" -p '*.zip'
          unzip -q optcg-web-v095.zip -d payload
          echo "payload files: $(find payload/web -type f | wc -l)"
          test -f payload/web/index.html
          test -d payload/web/art
      - name: Replace gh-pages content and fast-forward push (no force)
        run: |
          cd gh-pages
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r "$RUNNER_TEMP/payload/web/." .
          echo "deployed files: $(find . -type f -not -path './.git/*' | wc -l)"
          git config user.name restore-bot
          git config user.email action@github.com
          git add -A
          git commit -m "restore: gh-pages = v0.9.5 demo (db02b36 web content, fast-forward, no force)"
          git push origin gh-pages
