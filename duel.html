<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伟大航路决斗 · 海贼王卡牌对战</title>
<link rel="stylesheet" href="duel.css?v=f804c93">
<link rel="stylesheet" href="scene.css?v=f804c93"><!-- round18 L1：月夜深海剧场场景层（全站共享） -->
</head>
<body class="duel-scene">
<div id="app">
  <header id="topbar">
    <div class="turn-chip" id="turnChip">第 1 回合 · 你的回合</div>
    <h1 class="duel-title">伟大航路决斗</h1>
    <div class="top-actions">
      <button id="btnHelp" class="ghost-btn">规则</button>
      <button id="btnFx" class="ghost-btn" title="闪烁/脉冲等演出动画开关（也自动跟随系统「减少动态效果」设置）">动效：开</button>
      <button id="btnSnd" class="ghost-btn" title="合成音效开关（默认关，独立于动效设置）">音效：关</button>
      <a class="ghost-btn" href="campaign.html">闯关模式</a>
      <a class="ghost-btn" href="mode.html">模式</a>
      <button id="btnRestart" class="ghost-btn">重新开局</button>
      <a class="ghost-btn" href="index.html">旧版入口</a>
    </div>
    <button id="btnMenu" class="ghost-btn menu-btn" title="菜单">☰</button>
  </header>

  <div id="phaseBar">
    <span class="ph" data-ph="draw">抽牌</span>
    <span class="ph-arrow">›</span>
    <span class="ph" data-ph="standby">准备</span>
    <span class="ph-arrow">›</span>
    <span class="ph" data-ph="main1">主要1</span>
    <span class="ph-arrow">›</span>
    <span class="ph" data-ph="battle">战斗</span>
    <span class="ph-arrow">›</span>
    <span class="ph" data-ph="main2">主要2</span>
    <span class="ph-arrow">›</span>
    <span class="ph" data-ph="end">结束</span>
  </div>

  <main id="table">
    <!-- 对手区 -->
    <section class="zone foe" id="foeZone">
      <div class="pinfo">
        <div class="pname" id="foeName">亚尔丽塔（AI）</div>
        <!-- round13 C2：对手 LP 徽章=直攻入口（一元素双语义；选中攻击者+对方空场时变红呼吸） -->
        <button id="btnDirect" class="lp-wrap lp-badge" type="button"
          aria-label="对方生命值；战斗阶段选中攻击者后变红，点击可直接攻击">
          <span class="lp-num" id="foeLpNum">4000</span><i class="dp-hint">⚔ 直攻</i>
        </button>
        <div class="pcounts">
          <span class="chip">牌组 <b id="foeDeckN">20</b></span>
          <span class="chip">手牌 <b id="foeHandN">5</b></span>
          <span class="chip">墓场 <b id="foeGraveN">0</b></span>
        </div>
      </div>
      <div class="foe-hand" id="foeHand"></div>
      <div class="unit-row" id="foeBoard"></div>
      <div class="spell-row foe-spells" id="foeSpells"></div>
    </section>

    <!-- round13 C3：中场浪线（绝对定位零占高，海图桌面的分界装饰） -->
    <div class="sea-line" aria-hidden="true"></div>

    <!-- 我方区 -->
    <section class="zone mine" id="mineZone">
      <div class="unit-row" id="myBoard"></div>
      <div class="spell-row my-spells" id="mySpells"></div>
      <div class="pinfo">
        <div class="pname" id="myName">玩家 · 草帽团·起航</div>
        <div class="pcounts">
          <span class="chip">牌组 <b id="myDeckN">20</b></span>
          <span class="chip">墓场 <b id="myGraveN">0</b></span>
        </div>
        <div class="lp-wrap lp-badge" aria-label="我方生命值"><span class="lp-num" id="myLpNum">4000</span></div>
      </div>
      <div class="my-hand" id="myHand"></div>
    </section>
    <!-- round15 A：攻击瞄准光刃 overlay（选中攻击者时由 JS 画贝塞尔曲线；四层光刃+目标端锁定环） -->
    <svg id="atkArrow" class="atk-arrow" aria-hidden="true">
      <defs>
        <linearGradient id="bladeGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0">
          <stop offset="0" stop-color="#ffd76e" stop-opacity="0"/>
          <stop offset=".3" stop-color="#ffd76e" stop-opacity=".5"/>
          <stop offset="1" stop-color="#fff8dd" stop-opacity=".95"/>
        </linearGradient>
      </defs>
      <path class="halo" /><path class="glow" /><path class="core" />
      <path class="pulse" />
      <g class="lock"><g class="lock-spin">
        <circle class="lock-ring" r="26" />
        <circle class="lock-ring2" r="17" />
        <circle class="lock-dot" r="3" />
      </g></g>
    </svg>
  </main>

  <!-- round13 C3：桌面端战报侧栏（≥721px 常驻右列；手机隐藏走抽屉） -->
  <aside id="logSide" class="log-side">
    <div class="ls-head">⚙ 战报</div>
    <div class="ls-body" id="ldSideBody"></div>
  </aside>

  <!-- 底部动作条：提示 + 战报 ticker + 主按钮（桌面手机同构） -->
  <footer id="actionBar">
    <div class="ab-left">
      <div id="hint">— 决斗准备 —</div>
      <div id="ticker" aria-live="polite"></div>
    </div>
    <button id="btnToMain2" class="ab-sub hidden" title="不结束回合，先去主要阶段2 登场/盖伏">出牌 ›</button>
    <button id="btnNext" class="next-btn ab-btn">下一步 ›</button>
  </footer>
</div>

<!-- 弹层：登场选项 -->
<div id="modal" class="modal hidden">
  <div class="modal-box" id="modalBox"></div>
</div>
<!-- 响应窗口横幅 -->
<div id="respondBanner" class="respond-banner hidden">
  <div class="rb-text" id="rbText"></div>
  <div class="rb-btns" id="rbBtns"></div>
</div>
<!-- 战报抽屉（点击 ticker 展开） -->
<div id="logDrawer" class="log-drawer">
  <div class="ld-head"><b>战斗记录</b><button id="ldClose">收起 ▾</button></div>
  <div id="ldBody"></div>
</div>
<!-- toast -->
<div id="toast" class="toast hidden"></div>
<!-- 胜负遮罩 -->
<div id="endOverlay" class="end-overlay hidden">
  <div class="end-box">
    <div class="end-title" id="endTitle"></div>
    <div class="end-sub" id="endSub"></div>
    <div class="end-btns">
      <button class="next-btn big hidden" id="btnNextStage">下一关 ⚔</button>
      <button class="next-btn big" id="btnAgain">再战一局</button>
    </div>
  </div>
</div>

<script type="module" src="duel-ui.js?v=f804c93"></script>
</body>
</html>
