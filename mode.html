<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>伟大航路决斗 · 模式选择</title>
<link rel="stylesheet" href="duel.css?v=23f3fe8">
<style>
/* mode.html 补丁：两张模式大卡 + 移动端单屏 */
body.mode-scene { display: flex; flex-direction: column; min-height: 100dvh; }
.mode-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 22px; padding: 24px 16px; max-width: 760px; margin: 0 auto; width: 100%; }
.mode-title { font-size: clamp(26px, 6vw, 40px); letter-spacing: 8px; color: var(--gold-bright);
  text-shadow: 0 0 22px rgba(212,175,55,.45); }
.mode-title small { display: block; text-align: center; font-size: 13px; letter-spacing: 3px;
  color: #8fa5cc; margin-top: 8px; }
.mode-cards { display: flex; gap: 18px; width: 100%; justify-content: center; flex-wrap: wrap; }
.mode-card { flex: 1 1 300px; max-width: 340px; min-height: 240px; border-radius: 18px; cursor: pointer;
  display: flex; flex-direction: column; gap: 8px; padding: 26px 24px; text-decoration: none;
  border: 2px solid var(--gold-dim); background: linear-gradient(180deg, rgba(16,32,63,.92), rgba(8,17,38,.95));
  box-shadow: 0 12px 36px rgba(0,0,0,.5); transition: transform .18s, box-shadow .18s, border-color .18s;
  position: relative; overflow: hidden; }
.mode-card::before { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 34%, rgba(255,244,200,.07) 50%, transparent 66%); }
.mode-card:hover { transform: translateY(-6px); border-color: var(--gold-bright);
  box-shadow: 0 18px 46px rgba(212,175,55,.28); }
.mode-card .ico { font-size: 44px; line-height: 1; }
.mode-card h2 { color: var(--gold-bright); font-size: 21px; letter-spacing: 2px; }
.mode-card p { color: #b9c9e6; font-size: 13.5px; line-height: 1.7; }
.mode-card .tags { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.mode-card .tag { font-size: 11px; padding: 2px 10px; border-radius: 999px;
  border: 1px solid #2a4a7e; color: #a9bde0; background: #0e1c38; }
.mode-card.vs { border-color: #a33c3c; }
.mode-card.vs:hover { border-color: #ff6b6b; box-shadow: 0 18px 46px rgba(229,72,77,.3); }
.mode-card.vs h2 { color: #ffd9d9; text-shadow: 0 0 14px rgba(229,72,77,.55); }
.mode-foot { display: flex; gap: 10px; justify-content: center; padding: 14px 0 20px; flex-wrap: wrap; }
@media (max-width: 720px) {
  .mode-title { letter-spacing: 5px; }
  .mode-cards { flex-direction: column; align-items: stretch; }
  .mode-card { min-height: 0; max-width: none; padding: 18px; flex-direction: row; align-items: center; }
  .mode-card .ico { font-size: 34px; }
  .mode-card .body { display: flex; flex-direction: column; gap: 6px; }
  .mode-card .tags { margin-top: 2px; }
}
</style>
</head>
<body class="duel-scene mode-scene">
  <div class="mode-wrap">
    <h1 class="mode-title">伟大航路决斗<small>ONE PIECE · 卡牌对战</small></h1>
    <div class="mode-cards">
      <a class="mode-card vs" href="battle.html">
        <span class="ico">⚔️</span>
        <span class="body">
          <h2>直接对战</h2>
          <p>选阵营、挑对手，全卡池构筑牌组，随时和电脑 AI 打一场。</p>
          <span class="tags"><span class="tag">八阵营</span><span class="tag">371 张卡</span><span class="tag">牌组工坊</span></span>
        </span>
      </a>
      <a class="mode-card" href="campaign.html">
        <span class="ico">🗺️</span>
        <span class="body">
          <h2>故事模式</h2>
          <p>重走东海篇八关，击败强敌解锁新卡，攒出你的海贼团。</p>
          <span class="tags"><span class="tag">东海篇</span><span class="tag">通关解锁</span><span class="tag">新手教学</span></span>
        </span>
      </a>
    </div>
  </div>
  <div class="mode-foot">
    <a class="ghost-btn" href="duel.html">⚡ 快速对决</a>
    <a class="ghost-btn" href="index.html">⛵ 旧版入口</a>
  </div>
</body>
</html>
