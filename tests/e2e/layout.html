<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>OPTCG layout test</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#000}iframe{border:0;display:block}</style>
</head>
<body>
<!-- layout.html — 小屏（390×748）布局回归宿主页（E2E 正式资产，tests/e2e/）。
     原理：headless Chrome 的 --window-size 不落到布局视口（实测 390 物理 → innerWidth 504），
     固定尺寸 iframe 才是精确视口——媒体查询/vw/innerWidth 以 iframe 尺寸为准。
     断言：① 大厅滚底模式卡与 sticky CTA 同屏 ② help 关闭钮钉底可达（不滚正文）
           ③ 10+ 手牌时横向溢出收敛在手牌行内（页面级无横滚、顶栏按钮不被推出屏）
     运行：node tests/e2e/run.mjs --only layout（Chrome 需 --allow-file-access-from-files，runner 已带）。
     结果经 <title>LAYOUT-RESULT …> 交给 runner 解析；不挂正式页面、无玩家可见入口。 -->
<iframe id="f" width="390" height="748"></iframe>
<script>
(function () {
  'use strict';
  const f = document.getElementById('f');
  const W = 390, H = 748;
  const R = { steps: [], errors: [] };
  const step = (name, ok, detail) => { R.steps.push({ name, ok: !!ok, detail: detail == null ? '' : String(detail) }); return ok; };
  window.addEventListener('error', (e) => R.errors.push(e.message));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const waitFor = async (c, t = 12000, every = 120) => {
    const t0 = Date.now();
    for (;;) { let v; try { v = await c(); } catch (e) { v = false; } if (v) return v; if (Date.now() - t0 > t) return false; await sleep(every); }
  };

  function run() {
    return new Promise(async (done) => {
      try { localStorage.setItem('optcg_onboarded', '1'); } catch (e) { /* 同源共享，失败由后续断言暴露 */ }
      f.src = '../../web/index.html';
      await waitFor(() => { try { return f.contentDocument.readyState === 'complete' && f.contentDocument.getElementById('btnStart'); } catch (e) { return false; } }, 15000);
      const D = f.contentDocument;
      await sleep(1400); // 大厅入场动效
      const $ = (id) => D.getElementById(id);
      const rect = (el) => el ? el.getBoundingClientRect() : null;
      const inVp = (el) => { const r = rect(el); return !!r && r.top >= -2 && r.bottom <= H + 2 && r.left >= -2 && r.right <= W + 2; };

      // ===== ① 大厅：sticky CTA 首屏可见；滚底后模式卡与 CTA 同屏 =====
      step('390 大厅首屏出航钮可见(sticky-cta)', inVp($('btnStart')));
      const card = D.querySelector('#setupPanel .modal-card');
      card.scrollTop = card.scrollHeight;
      await sleep(500);
      const lad = rect($('btnLadder')), sur = rect($('btnSurvival')), cta = rect(D.querySelector('.sticky-cta'));
      step('滚底后两张模式卡完整可见', !!lad && !!sur && lad.top >= 0 && sur.bottom <= H, lad && sur ? `ladder ${Math.round(lad.top)}-${Math.round(lad.bottom)} survival ${Math.round(sur.top)}-${Math.round(sur.bottom)}` : '缺卡');
      step('模式卡未被 sticky CTA 遮挡', !!sur && !!cta && sur.bottom <= cta.top + 6, `survival底${Math.round(sur.bottom)} cta顶${Math.round(cta.top)}`);
      step('滚底后出航钮仍可见', inVp($('btnStart')));

      // ===== ② help：正文内滚、关闭钮钉底（触屏无 ESC，不允许滚完正文才能关）=====
      $('btnHallHelp').click();
      await waitFor(() => !$('helpPanel').classList.contains('hidden'), 4000);
      await sleep(400);
      const hc = D.querySelector('#helpPanel .modal-card');
      const hcl = rect($('btnHelpClose'));
      step('help 打开后关闭钮直接可见(不滚动)', !!hcl && hcl.bottom <= H && hcl.top >= 0, `close ${Math.round(hcl && hcl.top)}-${Math.round(hcl && hcl.bottom)} 视口${H}`);
      const hb = hc.querySelector('.help-body');
      step('help 滚动收敛在正文内(卡片自身不滚)', hb.scrollHeight > hb.clientHeight && hc.scrollHeight <= hc.clientHeight + 2, `card ${hc.scrollHeight}/${hc.clientHeight} body ${hb.scrollHeight}/${hb.clientHeight}（正文滚、卡片不滚=关闭钮钉底结构成立）`);
      $('btnHelpClose').click();
      await waitFor(() => $('helpPanel').classList.contains('hidden'), 4000);
      step('help 可正常关闭', true);

      // ===== ③ 对局：养手牌到 10+，横向溢出必须收敛在手牌行内 =====
      $('btnStart').click();
      await waitFor(() => $('setupPanel').classList.contains('hidden') && f.contentWindow.OPTCG_GAME && f.contentWindow.OPTCG_GAME.state(), 6000);
      await sleep(2200); // DUEL 横幅自隐
      const waitS = (c, t) => waitFor(c, t).catch(() => false);
      for (let i = 0; i < 6; i++) { // 6 轮结束回合（不主动出牌）养手牌
        const rp = $('responsePanel');
        if (rp && !rp.classList.contains('hidden')) { const p = $('btnPass'); p && p.click(); await sleep(300); }
        if (!$('phaseBadge').textContent.includes('你的回合')) {
          await waitS(() => $('phaseBadge').textContent.includes('你的回合'), 8000);
          continue;
        }
        $('btnEnd').click();
        await waitS(() => $('phaseBadge').textContent.includes('敌方回合'), 8000);
        await waitS(() => { const r2 = $('responsePanel'); if (r2 && !r2.classList.contains('hidden')) { const p = $('btnPass'); p && p.click(); } return $('phaseBadge').textContent.includes('你的回合'); }, 10000);
        await sleep(300);
      }
      const st = f.contentWindow.OPTCG_GAME.state();
      const hand = $('myHand');
      const n = hand.querySelectorAll('.card').length;
      const nEnd = st && st.winner !== null;
      if (!nEnd && n < 9) step('养出 9+ 张手牌(横滑前提)', false, `仅 ${n} 张（对局已提前结束则豁免：winner=${st && st.winner}）`);
      else step('养出 9+ 张手牌(横滑前提)', true, n + ' 张');
      if (!nEnd) {
        const pageOver = () => {
          const doc = D.documentElement;
          let offenders = '';
          const w = Math.max(doc.scrollWidth, D.body ? D.body.scrollWidth : 0) - W;
          if (w > 2) { // 定位超宽元素（排障信息；排除 #myHand 滚动体内被裁剪的卡片=噪声）
            const seen = new Map();
            const handEl = $('myHand');
            for (const el of D.body.querySelectorAll('*')) {
              if (handEl && handEl.contains(el)) continue;
              const r = el.getBoundingClientRect();
              if (r.right > W + 1 && r.width > 0) {
                const k = el.tagName + (el.id ? '#' + el.id : '') + (el.className && typeof el.className === 'string' ? '.' + el.className.split(' ').filter(Boolean)[0] : '');
                seen.set(k, Math.round(r.right));
              }
            }
            offenders = [...seen.entries()].slice(0, 4).map(([k, v]) => `${k}→${v}`).join(' ');
          }
          return [w, offenders];
        };
        let [po, off] = pageOver();
        step('手牌溢出不出页面级横向滚动', po <= 2, `doc scrollWidth vs 视口${W}：${po > 2 ? '超出 ' + po + 'px：' + off : '无横滚'}`);
        const tops = ['btnHelp', 'btnRestart', 'btnMenu'].filter((id) => inVp($(id))).length;
        step('顶栏三按钮仍全部可见(未被推出屏)', tops === 3, tops + '/3');
        const over = hand.scrollWidth > hand.clientWidth + 4;
        if (over) {
          const fr = D.querySelector('.hand-fade-r');
          step('手牌行溢出时右缘渐隐提示亮起', !!(fr && fr.classList.contains('show')), `sw ${hand.scrollWidth} cw ${hand.clientWidth}`);
          hand.scrollLeft = 999;
          // dump-dom 虚拟时间不泵渲染步、scroll 事件不派发；手动派发以验证「scroll→渐隐刷新」接线（真机触屏滚动天然走同一路径）
          hand.dispatchEvent(new Event('scroll'));
          await sleep(120);
          const fl = D.querySelector('.hand-fade-l');
          step('滚到右端后左缘渐隐亮起(可回滑可知)', !!(fl && fl.classList.contains('show')));
        } else step('手牌行溢出时右缘渐隐提示亮起', true, '手牌未溢出（首行断言已保证张数，此处不适用）');
        // ===== ④ 满战场边界：双方各注入 7 单位，断言战场行换行后页面仍无横滚 =====
        for (const id of ['enemyBoard', 'myBoard']) {
          const b = $(id);
          for (let k = 0; k < 7; k++) {
            const c = D.createElement('div');
            c.className = 'card'; c.style.width = '58px'; c.style.height = '82px';
            b.appendChild(c);
          }
        }
        await sleep(250);
        const [po2, off2] = pageOver();
        const eb = $('enemyBoard'), mb = $('myBoard');
        step('满战场(7+7单位)换行不撑出页面横滚', po2 <= 2 && eb.scrollWidth <= eb.clientWidth + 2 && mb.scrollWidth <= mb.clientWidth + 2,
          `enemyBoard ${eb.scrollWidth}/${eb.clientWidth} myBoard ${mb.scrollWidth}/${mb.clientWidth} ${po2 > 2 ? '页面超出 ' + po2 + 'px：' + off2 : '页面无横滚'}`);
      }
      // 清理对局档，避免污染后续 E2E 的 hasUnfinished 断言
      try { localStorage.removeItem('optcg_save_v2'); } catch (e) { /* 尽力 */ }

      const fails = R.steps.filter((s) => !s.ok);
      R.summary = fails.length === 0 ? 'LAYOUT-PASS-' + R.steps.length : 'LAYOUT-FAIL-' + fails.length + '/' + R.steps.length;
      done();
    }).catch((e) => { R.errors.push('FATAL ' + (e && e.message)); R.summary = 'LAYOUT-FAIL-fatal'; });
  }
  window.addEventListener('load', () => run().finally(() => { document.title = 'LAYOUT-RESULT ' + JSON.stringify(R); }));
})();
</script>
</body>
</html>
